[[mapped_assets]]
source = "LICENSE"
destination = "anki_miner/LICENSE"

# The orchestration file is byte-identical to desktop and retains a
# TYPE_CHECKING-only YouTube service annotation. It cannot execute at runtime;
# no other forbidden import receives an exception.
[[forbidden_type_checking_exceptions]]
importer = "anki_miner.orchestration.episode_processor"
target = "anki_miner.services.youtube_fetcher"

# The language registry, the tagger provider and the pack-manifest loader load
# per-language modules by a code-formatted name; {code} expands over languages
# and SHARED_PACK_CODES.
[[dynamic_imports]]
importer = "anki_miner.languages.registry"
match = "f'anki_miner.languages.{code}'"
target = "anki_miner.languages.{code}"

[[dynamic_imports]]
importer = "anki_miner.languages.tagger_provider"
match = "f'anki_miner.languages.{language}.tokenizer'"
target = "anki_miner.languages.{code}.tokenizer"

# load_pack() builds f"{package}.pack" in a local variable before importing it.
# ja, he and id ship no pack.py; ar, fa and th do.
[[dynamic_imports]]
importer = "anki_miner.services.language_pack_installer"
match = "module_name"
target = "anki_miner.languages.{code}.pack"
