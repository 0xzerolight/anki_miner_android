name: Bug report
description: Report a bug to help improve Anki Miner for Android.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report.
        Please fill in as much detail as you can — it makes the fix faster.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong? Include what you expected to happen and what actually happened.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the bug.
      placeholder: |
        1. Open Anki Miner.
        2. Load video `…` and subtitle `…`.
        3. Tap `Mine`.
        4. Observe error.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Anki Miner version
      description: Shown in Settings → About (version name and code). Please update to the latest release first to see if it is already fixed.
      placeholder: 2.1.1 (code 30)
    validations:
      required: true

  - type: input
    id: mining_language
    attributes:
      label: Mining language
      description: The language you mine in (chosen in setup), if the bug involves mining.
      placeholder: e.g. Japanese, Cantonese, Arabic
    validations:
      required: false

  - type: input
    id: ankidroid_version
    attributes:
      label: AnkiDroid version
      description: From the AnkiDroid About screen.
      placeholder: 2.x.y
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Android version and device
      description: Android/API level, manufacturer and model.
      placeholder: Android 14 / API 34, Pixel 7
    validations:
      required: true

  - type: upload
    id: diagnostics
    attributes:
      label: Diagnostics bundle
      description: Settings → Diagnostics bundle → Share builds a redacted ZIP of the app's logs. Check it for private information before uploading.
    validations:
      required: false
      accept: ".zip,.log,.txt"

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output (optional paste alternative)
      description: If you cannot attach the bundle, paste any relevant log output or error messages. Review it for private information (file names, paths) before pasting.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Subtitle format, video container, reading format, dictionary in use, anything else that may be relevant.
    validations:
      required: false
