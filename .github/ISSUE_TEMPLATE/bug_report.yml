name: Bug report
description: Report one reproducible, non-security problem in an official Anki Miner Android release.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Anki Miner. Search existing issues first.

        Do not submit private video, audio, subtitles, books, dictionary content, Anki collection/export data, note contents, recovery databases, raw logcat, document URIs, device serials, account details, credentials, signing material, or access tokens. Use synthetic inputs and sanitized excerpts. Report vulnerabilities through GitHub private vulnerability reporting instead.

  - type: checkboxes
    id: safety
    attributes:
      label: Privacy and scope checks
      options:
        - label: This is not a security vulnerability or suspected privacy leak.
          required: true
        - label: I removed private user content, personal identifiers, credentials, document URIs, and unreviewed logs.
          required: true
        - label: I am testing an official GitHub release APK with the expected signing certificate, not a fork, debug build, or workflow artifact.
          required: true

  - type: input
    id: anki_miner_version
    attributes:
      label: Anki Miner version
      description: Include version name and code from the installed app or release record.
      placeholder: 0.1.2 (code 3)
    validations:
      required: true

  - type: input
    id: ankidroid_version
    attributes:
      label: AnkiDroid version
      placeholder: 2.x.y from the AnkiDroid About screen
    validations:
      required: true

  - type: input
    id: android_device
    attributes:
      label: Android and device
      description: Give Android/API, manufacturer/model, and RAM class if known. Do not include a serial, account, or private build identifier.
      placeholder: Android 16 / API 36, Example Model, 4 GiB RAM
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - First-run setup or permissions
        - UniDic or resource download/import/repair
        - Video and subtitle mining
        - TXT/Aozora reading
        - Subtitle reading
        - EPUB reading
        - Mokuro reading
        - Curation
        - AnkiDroid note/media creation or recovery
        - Offline TTS or local audio
        - Settings, navigation, accessibility, or theme
        - Installation or update
        - Other non-security behavior
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or privacy-safe input descriptions. Include whether the app was backgrounded, rotated, force-stopped, offline, or low on storage.
      placeholder: |
        1. Start with ...
        2. Select a synthetic 10-second MKV and SRT ...
        3. Tap ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: State whether any note/media was committed to AnkiDroid and whether retry, repair, or relaunch changed the result.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Minimal sanitized diagnostics
      description: Optional. Paste only the smallest reviewed excerpt needed. Do not attach raw logs or source files.

  - type: checkboxes
    id: final_review
    attributes:
      label: Final review
      options:
        - label: I reviewed every field and attachment again and confirm it is safe to publish.
          required: true
