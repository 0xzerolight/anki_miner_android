version: 2
updates:
  # pip is graph-only. Without a pip entry GitHub never re-runs the Python
  # dependency graph on push, so alerts on bumped packages stay open. The limit
  # of 0 stops version-update PRs: Dependabot would bump requirements-*.in and
  # leave the hash-pinned requirements-*.lock files it cannot regenerate, and
  # that pair fails the workflow's `--require-hashes` install step. Regenerate
  # locks by hand instead:
  #   uv pip compile requirements-<name>.in --generate-hashes --python-version 3.13
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # gradle is excluded: every bump invalidates gradle/verification-metadata.xml
  # and fails the `--dependency-verification strict` build until the checksums
  # are regenerated.
  #
  # Action SHAs are pinned, so this is what keeps them from going stale.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    groups:
      gh-actions:
        patterns:
          - "*"

  # Nested composite actions are outside the "/" entry's scan, so the Android
  # toolchain action needs its own directory or its pins go stale silently.
  - package-ecosystem: github-actions
    directory: "/.github/actions/android-build-toolchain"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    groups:
      gh-actions:
        patterns:
          - "*"
