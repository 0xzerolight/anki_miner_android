name: APK candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Share the hardware queue with CI and the AnkiDroid canary: this runner must
  # never overlap Gradle with an emulator owned by another workflow.
  group: anki-miner-android-hardware-ci
  cancel-in-progress: false

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  SOURCE_DATE_EPOCH: "315532800"
  TZ: UTC
  ANKI_MINER_ANDROID_TOOLCHAIN_ROOT: ${{ vars.ANKI_MINER_ANDROID_TOOLCHAIN_ROOT }}
  ORG_GRADLE_PROJECT_ankiMinerRuntimeManifest: ${{ vars.ANKI_MINER_RUNTIME_MANIFEST }}
  ORG_GRADLE_PROJECT_ankiMinerS1aManifest: ${{ vars.ANKI_MINER_S1A_MANIFEST }}
  ORG_GRADLE_PROJECT_ankiMinerS1aArm64AcceptanceApk: ${{ vars.ANKI_MINER_S1A_ACCEPTANCE_APK }}
  ANKI_MINER_S1A_ACCEPTANCE_RECEIPT: ${{ vars.ANKI_MINER_S1A_ACCEPTANCE_RECEIPT }}

jobs:
  unsigned-candidate:
    name: Build unsigned ARM64 APK
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, anki-miner-android]
    timeout-minutes: 120
    environment: apk-candidate
    steps:
      - name: Validate tag input
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || {
            echo "Tag must look like v0.1.0-alpha.1" >&2
            exit 1
          }

      - name: Checkout the exact tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify protected candidate inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$ANKI_MINER_ANDROID_TOOLCHAIN_ROOT"
          test -f "$ORG_GRADLE_PROJECT_ankiMinerRuntimeManifest"
          test -f "$ORG_GRADLE_PROJECT_ankiMinerS1aManifest"
          test -f "$ORG_GRADLE_PROJECT_ankiMinerS1aArm64AcceptanceApk"
          test -f "$ANKI_MINER_S1A_ACCEPTANCE_RECEIPT"
          test -z "$(git status --porcelain=v2 --untracked-files=all)"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
          test "$RELEASE_TAG" = "$(python3.13 -c \
            'import json; print("v" + json.load(open("release/version.json", encoding="utf-8"))["version_name"])')"

      - name: Build and audit the APK-only candidate
        shell: bash
        run: |
          set -euo pipefail
          source scripts/android-env.sh
          scripts/health.sh \
            --release-acceptance-receipt "$ANKI_MINER_S1A_ACCEPTANCE_RECEIPT"
          python3.13 scripts/github_release.py verify-unsigned \
            --apk app/build/outputs/apk/device/release/app-device-release-unsigned.apk \
            --expected-source "$(git rev-parse HEAD)"

      - name: Upload short-lived unsigned candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-apk-candidate-${{ inputs.tag }}
          path: app/build/outputs/apk/device/release/app-device-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
