name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: anki-miner-android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  TZ: UTC

jobs:
  secretless-host-checks:
    name: Secretless host checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Chaquopy build Python
        id: build_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Set up host Python 3.13
        id: host_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-host-test.lock

      - name: Install hash-locked host dependencies
        env:
          HOST_PYTHON: ${{ steps.host_python.outputs.python-path }}
        run: >-
          "$HOST_PYTHON" -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-host-test.lock
          -r requirements-lint.lock

      - name: Lint Python (ruff)
        run: ruff check .

      - name: Check Python formatting (black)
        run: black --check .

      - name: Run secretless tooling and bridge checks
        shell: bash
        env:
          ANKI_MINER_CHAQUOPY_BUILD_PYTHON: ${{ steps.toolchain.outputs.build-python-path }}
          HOST_PYTHON: ${{ steps.host_python.outputs.python-path }}
        run: |
          set -euo pipefail
          for script in scripts/*.sh .github/scripts/*.sh; do
            bash -n "$script"
          done
          "$HOST_PYTHON" -m unittest discover -s scripts/tests -v
          "$HOST_PYTHON" tools/instrumentation/audit_instrumentation.py
          "$HOST_PYTHON" -m unittest discover -s tools/ankidroid-api/tests -v
          "$HOST_PYTHON" tools/ankidroid-api/sync_ankidroid_api.py --check
          "$HOST_PYTHON" -m unittest discover -s tools/anki-contract/tests -v
          PYTHONDONTWRITEBYTECODE=1 "$HOST_PYTHON" -m unittest discover -s tools/themes/tests -v
          "$HOST_PYTHON" tools/anki-contract/generate_anki_limits.py --check
          "$HOST_PYTHON" tools/anki-contract/generate_unicode_contract.py --check
          "$HOST_PYTHON" tools/themes/generate_theme_palettes.py --check
          "$ANKI_MINER_CHAQUOPY_BUILD_PYTHON" \
            tools/anki-contract/generate_html5_entities.py --check
          "$HOST_PYTHON" -m unittest discover -s tools/dependencies/tests -v
          "$HOST_PYTHON" -m unittest discover -s tools/runtime-wheels/tests -v
          PYTHONPATH=tools/engine-sync \
            "$HOST_PYTHON" -m unittest discover -s tools/engine-sync/tests -v
          # `sync_engine.py --check` verifies the vendored engine against the
          # desktop source, so it needs the private desktop checkout and cannot
          # run on a secretless runner. It runs in scripts/health.sh locally.
          "$HOST_PYTHON" -m pytest -q tests/python/android_bridge
          "$HOST_PYTHON" -m compileall -q \
            app/src/main/python/android_bridge app/src/debug/python

      - name: Validate immutable engine parity fixture
        shell: bash
        env:
          HOST_PYTHON: ${{ steps.host_python.outputs.python-path }}
        run: |
          PYTHONPATH=tools/engine-sync "$HOST_PYTHON" - <<'PY'
          from pathlib import Path

          from engine_sync.golden_contract_v2 import validate_committed_fixture

          validate_committed_fixture(Path.cwd())
          print("immutable engine v2 fixture: OK")
          PY

  # Lint and the arm64 release were 578s of this leg's 832s Gradle step, and
  # instrumentation needs neither: run-api26-instrumentation.sh wants only the
  # two emulatorDebug APKs, and they are built in this same workspace.
  android-instrumentation:
    name: Android instrumentation (API 26)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs before the build: this depends on nothing above it, and a runner
      # without KVM should fail in seconds rather than after the Gradle leg.
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # `udevadm trigger` only queues the event; without settle the mode
          # change races the assertions below.
          sudo udevadm settle
          echo "id: $(id)"
          ls -l /dev/kvm || echo "/dev/kvm is absent"
          test -r /dev/kvm || { echo "::error::/dev/kvm not readable"; exit 1; }
          test -w /dev/kvm || { echo "::error::/dev/kvm not writable"; exit 1; }

      - name: Set up the Android build toolchain
        id: toolchain
        uses: ./.github/actions/android-build-toolchain

      - name: Run JVM tests and assemble the emulator APKs
        shell: bash
        env:
          ANKI_MINER_CHAQUOPY_BUILD_PYTHON: ${{ steps.toolchain.outputs.build-python-path }}
        run: |
          ./gradlew \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" \
            --stacktrace \
            --dependency-verification strict \
            :app:testEmulatorDebugUnitTest \
            :app:assembleEmulatorDebug \
            :app:assembleEmulatorDebugAndroidTest

      - name: Audit the packaged emulator artifact
        shell: bash
        run: |
          "${{ steps.toolchain.outputs.host-python-path }}" \
            tools/wheels/vendored_wheel_manifest.py check \
              --wheels-root app/wheels \
              --manifest app/wheels/manifest.json
          scripts/check-native-artifact.sh \
            --artifact app/build/outputs/apk/emulator/debug/app-emulator-debug.apk \
            --allow-abi x86_64 \
            --require-app-imy \
            --reject-base-unidic \
            --require-entry lib/x86_64/libanki_miner_mecab.so \
            --require-entry lib/x86_64/libffmpeg.so \
            --require-entry lib/x86_64/libffprobe.so \
            --require-entry lib/x86_64/libmedia3ext.so
          "${{ steps.toolchain.outputs.host-python-path }}" scripts/check_runtime_artifact.py \
            --artifact app/build/outputs/apk/emulator/debug/app-emulator-debug.apk \
            --vendored-manifest app/wheels/manifest.json \
            --allow-abi x86_64

      - name: Execute API 26 instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-port: 5558
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash .github/scripts/run-api26-instrumentation.sh

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Android build toolchain
        id: toolchain
        uses: ./.github/actions/android-build-toolchain

      - name: Lint the emulator debug variant
        shell: bash
        env:
          ANKI_MINER_CHAQUOPY_BUILD_PYTHON: ${{ steps.toolchain.outputs.build-python-path }}
        run: |
          ./gradlew \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" \
            --stacktrace \
            --dependency-verification strict \
            :app:lintEmulatorDebug

  android-device-release:
    name: Android device release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Android build toolchain
        id: toolchain
        uses: ./.github/actions/android-build-toolchain

      - name: Assemble the shipped arm64 release
        shell: bash
        env:
          ANKI_MINER_CHAQUOPY_BUILD_PYTHON: ${{ steps.toolchain.outputs.build-python-path }}
        run: |
          source_commit="$(git rev-parse HEAD)"
          ./gradlew \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" \
            --stacktrace \
            --dependency-verification strict \
            -PankiMinerSourceCommit="$source_commit" \
            :app:assembleDeviceRelease

      - name: Audit the packaged device artifact
        shell: bash
        run: |
          "${{ steps.toolchain.outputs.host-python-path }}" \
            tools/wheels/vendored_wheel_manifest.py check \
              --wheels-root app/wheels \
              --manifest app/wheels/manifest.json
          device_apk="app/build/outputs/apk/device/release/app-device-release-unsigned.apk"
          [[ -f "$device_apk" ]] || { echo "device release APK was not produced" >&2; exit 1; }
          scripts/check-native-artifact.sh \
            --artifact "$device_apk" \
            --allow-abi arm64-v8a \
            --require-app-imy \
            --reject-base-unidic \
            --require-entry lib/arm64-v8a/libanki_miner_mecab.so \
            --require-entry lib/arm64-v8a/libffmpeg.so \
            --require-entry lib/arm64-v8a/libffprobe.so \
            --require-entry lib/arm64-v8a/libmedia3ext.so
          "${{ steps.toolchain.outputs.host-python-path }}" scripts/check_runtime_artifact.py \
            --artifact "$device_apk" \
            --vendored-manifest app/wheels/manifest.json \
            --allow-abi arm64-v8a

  # The `main required checks` ruleset requires the context `Android API 26`.
  # The three lanes above report under their own names, so this job carries the
  # required context and fails unless every one of them succeeded. A fourth
  # lane stays advisory until it is added to `needs:`.
  android-api-26:
    name: Android API 26
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Without this the job is skipped when a lane fails, and a skipped required
    # check never reports, so the pull request waits forever instead of failing.
    if: always()
    needs:
      - android-instrumentation
      - android-lint
      - android-device-release
    steps:
      - name: Require every Android lane to have succeeded
        shell: bash
        env:
          LANE_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lane results: $LANE_RESULTS"
          for result in $LANE_RESULTS; do
            [[ "$result" == "success" ]] || {
              echo "::error::an Android lane reported $result"
              exit 1
            }
          done
