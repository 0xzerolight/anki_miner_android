name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: anki-miner-android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  TZ: UTC

jobs:
  secretless-host-checks:
    name: Secretless host checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up exact Chaquopy build Python
        id: build_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"

      - name: Set up host Python 3.13
        id: host_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-host-test.lock

      - name: Install hash-locked host dependencies
        env:
          HOST_PYTHON: ${{ steps.host_python.outputs.python-path }}
        run: >-
          "$HOST_PYTHON" -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-host-test.lock
          -r requirements-lint.lock

      - name: Lint Python (ruff)
        run: ruff check .

      - name: Check Python formatting (black)
        run: black --check .

      - name: Run secretless tooling and bridge checks
        shell: bash
        env:
          ANKI_MINER_CHAQUOPY_BUILD_PYTHON: ${{ steps.build_python.outputs.python-path }}
          HOST_PYTHON: ${{ steps.host_python.outputs.python-path }}
        run: |
          set -euo pipefail
          for script in scripts/*.sh .github/scripts/*.sh; do
            bash -n "$script"
          done
          "$HOST_PYTHON" -m unittest discover -s scripts/tests -v
          "$HOST_PYTHON" -m unittest discover -s tools/ankidroid-api/tests -v
          "$HOST_PYTHON" tools/ankidroid-api/sync_ankidroid_api.py --check
          "$HOST_PYTHON" -m unittest discover -s tools/anki-contract/tests -v
          "$HOST_PYTHON" tools/anki-contract/generate_anki_limits.py --check
          "$HOST_PYTHON" tools/anki-contract/generate_unicode_contract.py --check
          "$ANKI_MINER_CHAQUOPY_BUILD_PYTHON" \
            tools/anki-contract/generate_html5_entities.py --check
          "$HOST_PYTHON" -m unittest discover -s tools/dependencies/tests -v
          PYTHONPATH=tools/engine-sync \
            "$HOST_PYTHON" -m unittest discover -s tools/engine-sync/tests -v
          # `sync_engine.py --check` verifies the vendored engine against the
          # desktop source, so it needs the private desktop checkout and cannot
          # run on a secretless runner. It runs in scripts/health.sh locally.
          "$HOST_PYTHON" -m pytest -q tests/python/android_bridge
          "$HOST_PYTHON" -m compileall -q \
            app/src/main/python/android_bridge app/src/debug/python

      - name: Validate immutable engine parity fixture
        shell: bash
        env:
          HOST_PYTHON: ${{ steps.host_python.outputs.python-path }}
        run: |
          PYTHONPATH=tools/engine-sync "$HOST_PYTHON" - <<'PY'
          from pathlib import Path

          from engine_sync.golden_contract_v2 import validate_committed_fixture

          validate_committed_fixture(Path.cwd())
          print("immutable engine v2 fixture: OK")
          PY

  android-api-26:
    name: Android API 26
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up exact Chaquopy build Python
        id: build_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"

      - name: Set up host Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17.0.19+10"
          cache: gradle

      - name: Install exact Android build packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Run JVM tests, lint, and assemble emulator APKs
        shell: bash
        env:
          ANKI_MINER_CHAQUOPY_BUILD_PYTHON: ${{ steps.build_python.outputs.python-path }}
        run: |
          ./gradlew \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" \
            --stacktrace \
            --dependency-verification strict \
            :app:testEmulatorDebugUnitTest \
            :app:lintEmulatorDebug \
            :app:assembleEmulatorDebug \
            :app:assembleEmulatorDebugAndroidTest

      - name: Inspect emulator native artifact
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          toolchain_root="$RUNNER_TEMP/anki-miner-ci-toolchain"
          mkdir -p "$toolchain_root"
          ln -s "$ANDROID_HOME" "$toolchain_root/sdk"
          ln -s "$JAVA_HOME" "$toolchain_root/jdk-17"
          ANKI_MINER_ANDROID_TOOLCHAIN_ROOT="$toolchain_root" \
            scripts/check-native-artifact.sh \
              --artifact app/build/outputs/apk/emulator/debug/app-emulator-debug.apk \
              --allow-abi x86_64 \
              --require-app-imy \
              --reject-base-unidic \
              --require-entry lib/x86_64/libanki_miner_mecab.so \
              --require-entry lib/x86_64/libffmpeg.so \
              --require-entry lib/x86_64/libffprobe.so

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Execute API 26 instrumentation
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-port: 5558
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash .github/scripts/run-api26-instrumentation.sh
